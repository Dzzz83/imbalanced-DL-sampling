# Dataset Settings
dataset: cifar10
num_classes: 10
imb_type: exp
imb_factor: 0.01
data_path: ./data
classifier: 'dot_product_classifier'
augmentation: weak

# Selection Settings (SAVA)
selection_method: sava
selection_ratio: 1.0

# SAVA specific options
sava_batch_size: 5000
sava_cache_label_distances: true

# Training Strategy
strategy: SAVA_Reweight_DRW
reweight_mode: loss
sava_reweight_temp: 2.0
sava_weights_clip: 0.1
sava_max_weight: 5.0

# DRW Schedule
warm: 160

loss_type: CE
base_strategy: ERM

# Hyperparameters
epochs: 200
start_epoch: 0
print_freq: 10
batch_size: 128
learning_rate: 0.1
momentum: 0.9
weight_decay: 2e-4
lr_steps: [120, 160]
gamma: 0.1

rand_number: 123
workers: 4
optimizer: sgd

# Logging & Checkpoints
root_log: results/results_sava/cifar10/cifar10_exp0.01_sava_reweight_drw_seed123
cifar_root: ./data

# Hardware
device: cuda
gpu: 1
seed: 123
debug: true