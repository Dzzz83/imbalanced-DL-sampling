# Dataset Settings
dataset: cifar10
num_classes: 10
imb_type: exp
imb_factor: 0.01
data_path: ./data
classifier: 'dot_product_classifier'
augmentation: weak

# Selection Settings (SAVA)
selection_method: sava         
selection_ratio: 1.0          

# SAVA specific options
sava_batch_size: 5000          
sava_cache_label_distances: true   

# Training Strategy
strategy: SAVA_Reweight
reweight_mode: loss            

# --- CRITICAL CHANGES HERE ---
sava_reweight_temp: 1.0         # Changed from 100. Must be ~1.0 because scores are normalized to [0,1]
sava_weights_clip: 0.1          # Changed from 1e-3. Prevents any sample from being completely zeroed out
sava_max_weight: 10.0           # Keeps the cap at 10.0
warm: 160                       # Added explicitly. The model will train normally for 160 epochs, then apply SAVA weights.

# SAVA reweighting options (These are no longer used by the new code, but harmless to keep)
sava_reweight_method: exp          
sava_balance_classes: true         

loss_type: CE
train_rule: None
base_strategy: ERM

# Noise
noise_first: False
noise_ratio: 0.0

# Hyperparameters
epochs: 200
start_epoch: 0
print_freq: 10
batch_size: 128
learning_rate: 0.1
momentum: 0.9
weight_decay: 2e-4
lr_steps: [120, 160]
gamma: 0.1

rand_number: 0
mixup_alpha: 1.0
workers: 4
optimizer: sgd

# Logging & Checkpoints
root_log: results/results_sava/cifar10/cifar10_exp0.01_sava_reweight_loss
cifar_root: ./data

# Hardware
device: cuda
gpu: 0

# Seed
seed: 42

# Debug
debug: true