dataset: cifar100
num_classes: 100
imb_type: exp
imb_factor: 0.01
data_path: ./data
classifier: 'dot_product_classifier'
augmentation: weak

# Selection Settings (no selection)
selection_method: none
selection_ratio: 1.0

# Training Strategy
strategy: Experts
loss_type: CE
base_strategy: ERM

# Which experts to train (0=CE, 1=LA, 2=BS)
experts_to_train: [0, 1]          # <-- only CE and LA

# Data split (90% for experts, 10% held out for gate)
gate_split_ratio: 0.9

# Hyperparameters (paper for CE/LA, tuned for BS)
epochs: 256
start_epoch: 0
print_freq: 10
batch_size: 128
learning_rate: 0.4
momentum: 0.9
weight_decay: 1e-4
gamma: 0.1
rand_number: 42
workers: 4
optimizer: sgd

# Per‑expert overrides (order: CE, LA, BS)
expert_bias: [false, false, true]
expert_lr: [0.4, 0.4, 0.2]
expert_weight_decay: [1e-4, 1e-4, 5e-4]

# Logging & Checkpoints
root_log: results/experts_paper
root_model: checkpoint/experts_paper
store_name: cifar100_exp0.01_Experts_paper_seed42
cifar_root: ./data

# Hardware
device: cuda
gpu: 0

# Seed
seed: 42

# Debug and safety checks
debug: true
grad_clip_value: 10.0
check_freq: 10