dataset: cifar100
num_classes: 100
imb_type: exp
imb_factor: 0.01
data_path: ./data
classifier: 'dot_product_classifier'
augmentation: weak

selection_method: none
selection_ratio: 1.0

strategy: Gate

# Paper-specified hyperparameters (FIXED)
lambda_ent: 0.0
lambda_bal: 0.0
gate_lr: 0.001
gate_weight_decay: 0.0001
gate_epochs: 100
eval_interval: 20          # Evaluates at epochs 20, 40, 60, 80, 100
gate_hidden_size: 256
gate_hidden_size2: 128
gate_dropout: 0.0         # no dropout
routing_sparsity: 2

ce_bias: false
ce_ls: 0.0

la_bias: false
la_ls: 0.0
la_tau: 1.5

bs_bias: false
bs_ls: 0.0

# FIX: Define the sweep lists for Stage 2
gate_batch_sizes: [128]
gate_temperatures: [1.0, 2.0, 5.0, 10.0]

# Point to the directory where _experts_train_90.yaml saved the checkpoints
expert_ckpt_dir: checkpoint/experts_sweep_cifar100
gate_split_ratio: 0.9      # 10% gate split

# Backbone training hyperparameters (ignored by gate, but required by config parser)
epochs: 256
start_epoch: 0
print_freq: 10
batch_size: 128
lr: 0.4
momentum: 0.9
weight_decay: 1e-4
gamma: 0.1
rand_number: 42
workers: 4
optimizer: sgd

root_log: results/gate_cifar100
root_model: checkpoint/gate_cifar100_new
store_name: cifar100_exp0.01_Gate_seed42
cifar_root: ./data

device: cuda
gpu: 1

seed: 42

debug: true