dataset: cifar100
num_classes: 100
imb_type: exp
imb_factor: 0.01
data_path: ./data
classifier: 'dot_product_classifier'
augmentation: weak

selection_method: none
selection_ratio: 1.0

strategy: Gate

# Paper-specified hyperparameters (FIXED)
lambda_ent: 0.0
lambda_bal: 0.0
gate_lr: 0.001
gate_weight_decay: 0.0001
gate_epochs: 100
eval_interval: 20          # Evaluates at epochs 20, 40, 60, 80, 100
gate_hidden_size: 256
gate_hidden_size2: 128
gate_dropout: 0.0         # set below (round-2: 0.1)
gate_oracle_tau: 0.2      # soft-oracle sharpness (lower = closer to hard argmax)

ce_bias: false
ce_ls: 0.0

la_bias: false
la_ls: 0.0
la_tau: 1.5

bs_bias: false
bs_ls: 0.0

# FIX: Define the sweep lists for Stage 2
gate_batch_sizes: [128]
# Per-expert temperatures (fit on tune) now do the calibration work; the
# global T=2/5/10 sweep was degenerate (NLL ~3.4) and is dropped.
gate_temperatures: [1.0]

# --- Stage-2 post-mortem fixes (8/24) ---
gate_target_mode: logprob      # logprob (sharp log-space target, fixes tail gradient starvation) | mix_nll | correctness
mix_space: logit              # logit (recommended, BalPoE) | prob
gate_weight_floor: 0.0        # minimum per-expert mixture weight (0 = off)
gate_norm_blocks: true        # L2-normalize each expert's prob block in gate input
fit_expert_temps: true        # fit per-expert T on tune (minimize NLL)
fit_gate_temp: true           # fit gate-logit T on tune (maximize bal acc)
fit_mix_temp: true            # fit final mixture T on tune (logit space; calibrates NLL)
expert_temperatures: [1.5, 1.2, 1.5]  # Balanced: CE default, LA slightly sharper (tail specialist), BS default
# gate_linear_router disabled — using MLP (316→64→3) which gave best results (Exp 13: 44.16% bal acc).

# --- Round-2 fixes (8/25): stop noise-driven routing ---
# k=3 (full mixture, no truncation): the 8/25 run lost 2 pp on Head classes
# because top-2 truncation discards the 3rd expert's vote; k=3 keeps it.
# (Confirm on the existing checkpoint first: python debug_routing_signal.py)
routing_sparsity: 3
# Gate dropout: the gate trains on only ~1.1k samples (10% of CIFAR-100-LT);
# the config previously advertised gate_dropout but GateMLP never used it.
gate_dropout: 0.1
# Disagree weighting and KL(uniform) regularizer: disabled for logprob mode.
# The log-space sharpened target provides strong gradients on tail samples
# naturally; these regularizers would fight that signal.
gate_disagree_weight: false
gate_kl_uniform: 0.0

# --- Round-3 fixes (8/26): explicit head/tail signal for the gate ---
# Class-frequency features (log-prior of each expert's predicted class + of
# the uniform mixture's predicted class) appended to the gate input.
# The round-2 run's tail gain (+0.67) came from routing tail->LA, but LA
# ALONE already gets Low 12.21 vs the method's 12.08: the gate dilutes the
# signal it can't reliably detect. These features make "predicted tail class
# -> boost LA" directly learnable (LTDA-Router: frequency-aware routing).
gate_freq_features: true

# Point to the directory where _experts_train_90.yaml saved the checkpoints
expert_ckpt_dir: checkpoint/experts_sweep_cifar100_calib
gate_split_ratio: 0.9      # 10% gate split

# Backbone training hyperparameters (ignored by gate, but required by config parser)
epochs: 256
start_epoch: 0
print_freq: 10
batch_size: 128
lr: 0.4
momentum: 0.9
weight_decay: 1e-4
gamma: 0.1
rand_number: 42
workers: 4
optimizer: sgd

root_log: results/gate_cifar100_new
root_model: checkpoint/gate_cifar100_new
store_name: cifar100_exp0.01_Gate_seed42
cifar_root: ./data

device: cuda
gpu: 1

seed: 42

debug: true