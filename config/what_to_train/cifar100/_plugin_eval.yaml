# Dataset Settings
dataset: cifar100
num_classes: 100
imb_type: exp
imb_factor: 0.01
data_path: ./data
classifier: 'dot_product_classifier'
augmentation: weak

# Selection Settings (no selection)
selection_method: none
selection_ratio: 1.0

# Training Strategy
strategy: Gate

# Gate hyperparameters (must match trained gate)
lambda_ent: 0.01
lambda_bal: 0.05
gate_lr: 0.001
gate_weight_decay: 0.0001
gate_epochs: 100
gate_hidden_size: 256
gate_hidden_size2: 128
routing_sparsity: 2

# Stage 3: Plug-in Rule
plugin_algo: Bal

# Path to the best expert checkpoint from first run
expert_checkpoint: checkpoint/experts_cifar100/checkpoint_experts_epoch255.pth
best_model: checkpoint/gate_cifar100/gate_checkpoint_epoch99.pth
# Path to the directory containing the 3 independent expert checkpoints
expert_ckpt_dir: checkpoint/experts_cifar100

# Data split ratio (must match the split used in expert training)
gate_split_ratio: 0.9

# Hyperparameters (used for dataloaders)
epochs: 256
start_epoch: 0
print_freq: 10
batch_size: 128
learning_rate: 0.4
momentum: 0.9
weight_decay: 1e-4
gamma: 0.1
rand_number: 42
workers: 4
optimizer: sgd

# Logging & Checkpoints
root_log: results/gate_cifar100
root_model: checkpoint/gate_cifar100
store_name: cifar100_exp0.01_Plugin_seed42
cifar_root: ./data

# Hardware
device: cuda
gpu: 1

# Seed
seed: 42

# Debug
debug: true