dataset: cifar100
num_classes: 100
imb_type: exp
imb_factor: 0.01
data_path: ./data
classifier: 'dot_product_classifier'
augmentation: weak

strategy: Experts
epochs: 256
batch_size: 128
learning_rate: 0.4
momentum: 0.9
weight_decay: 1e-4
gamma: 0.1
rand_number: 42
workers: 4
optimizer: sgd

# Only train CE (0) and LA (1)
experts_to_train: [0, 1]

# Explicitly set per‑expert settings (to be extra safe)
expert_bias: [false, false, false]   # bias=False for both
expert_lr: [0.4, 0.4, 0.4]
expert_weight_decay: [1e-4, 1e-4, 1e-4]

root_log: results/experts_ce_la
root_model: checkpoint/experts_ce_la
store_name: cifar100_exp0.01_Experts_ce_la_seed42
cifar_root: ./data

device: cuda
gpu: 0
seed: 42
debug: true
grad_clip_value: 10.0
check_freq: 10