# Dataset Settings
dataset: cifar10
num_classes: 10
imb_type: exp        # Exponential imbalance
imb_factor: 0.01     # 100:1 ratio between head and tail classes
data_path: ./data
classifier: 'dot_product_classifier'
augmentation: weak

# Selection Settings (SAVA Conversion)
selection_method: sava         # Changed from lava to sava
selection_ratio: 0.7           # Keep 70% of the data based on SAVA scores 
device: cuda

# Noise
noise_first: True
noise_ratio: 0.15

# SAVA Explicit Parameters 
sava_batch_size: 5000          # Batch size for SAVA scoring
sava_cache_label_distances: True

# Training Strategy
strategy: RandomOversampling_Selection
base_strategy: ERM
loss_type: CE        # Cross Entropy (can be LDAM or CB)
train_rule: None     # Can be 'DRW' to trigger re-weighting mid-training

# Hyperparameters
epochs: 200
start_epoch: 0
print_freq: 10

batch_size: 128
learning_rate: 0.1
momentum: 0.9
weight_decay: 2e-4
lr_steps: [120, 160] # Epochs where the learning rate drops
gamma: 0.1

rand_number: 0


workers: 4
optimizer: sgd

# Logging & Checkpoints (Updated keywords to SAVA)
root_log: results_sava/cifar10_exp0.01_noisy0.15_randOversamp2
root_model: ./example/checkpoint_cifar10
store_name: cifar10_sava_selection_0.7_randOversamp_exp0.01
cifar_root: ./data
gpu: 1

seed: 42