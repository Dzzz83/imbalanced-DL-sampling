# Dataset Settings
dataset: cifar100
num_classes: 100
imb_type: exp
imb_factor: 0.01
data_path: ./data
classifier: 'dot_product_classifier'
augmentation: weak

# Strategy
strategy: ClassBalanced_ERM_DRW
loss_type: CE

# DRW Schedule (MUST match SAVA run for fair comparison)
warm: 160

# Clipping and max weight (MUST match SAVA run for fair comparison)
sava_weights_clip: 0.1
sava_max_weight: 5.0

# Hyperparameters
epochs: 200
start_epoch: 0
print_freq: 10
batch_size: 128
learning_rate: 0.1
momentum: 0.9
weight_decay: 2e-4
lr_steps: [120, 160]
gamma: 0.1

rand_number: 9999
workers: 4
optimizer: sgd

# Logging & Checkpoints
root_log: results/results_sava/cifar100/cifar100_exp0.01_class_balanced_drw_seed9999
cifar_root: ./data

# Hardware
device: cuda
gpu: 0
seed: 9999
debug: true