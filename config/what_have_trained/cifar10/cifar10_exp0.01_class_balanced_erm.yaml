dataset: cifar10
num_classes: 10
imb_type: exp
imb_factor: 0.01
data_path: ./data
classifier: 'dot_product_classifier'
augmentation: weak

# Selection – set to none or keep sava but it won't be used (trainer doesn't read scores)
selection_method: none         # or 'sava' – but we ignore scores
selection_ratio: 1.0

# Strategy
strategy: ClassBalanced_ERM

# Clipping and max weight (same as SAVA run for fair comparison)
sava_weights_clip: 0.1
sava_max_weight: 10.0

# Hyperparameters (identical to your SAVA run)
epochs: 200
start_epoch: 0
print_freq: 10
batch_size: 128
learning_rate: 0.1
momentum: 0.9
weight_decay: 2e-4
lr_steps: [120, 160]
gamma: 0.1

rand_number: 0
workers: 4
optimizer: sgd

root_log: results/results_sava/cifar10/cifar10_exp0.01_class_balanced_erm
cifar_root: ./data

device: cuda
gpu: 0
seed: 42
debug: true