# Dataset Settings
dataset: cifar100
num_classes: 100
imb_type: exp        # Exponential imbalance
imb_factor: 0.01     # 100:1 ratio between head and tail classes
data_path: ./data
classifier: 'dot_product_classifier'
augmentation: weak

# Selection Settings (SAVA)
selection_method: sava         # Options: sava, random, none
selection_ratio: 0.7           # Keep 70% of the data based on SAVA scores (most valuable)
device: cuda

# Noise
noise_first: False
noise_ratio: 0.25

# SAVA specific options (optional, defaults shown)
sava_batch_size: 5000          # Batch size for hierarchical OT computation
sava_cache_label_distances: true   # Cache label‑to‑label OT distances across batches

# Training Strategy
strategy: DeepSMOTE_Sava
loss_type: CE        # Cross Entropy (can be LDAM or CB)
train_rule: None     # Can be 'DRW' to trigger re‑weighting mid‑training
base_strategy: ERM

# Hyperparameters
epochs: 200
start_epoch: 0
print_freq: 10

batch_size: 128
learning_rate: 0.1
momentum: 0.9
weight_decay: 2e-4
lr_steps: [120, 160]   # Epochs where the learning rate drops
gamma: 0.1

rand_number: 0
# Augmentation (for training after selection)
mixup_alpha: 1.0        # Strength of the mixup interpolation (if used)
workers: 4
optimizer: sgd

# Logging & Checkpoints
root_log: results_sava/cifar100/cifar100_exp0.01_deepSMOTE_noise0.25
root_model: ./example/checkpoint_cifar10
store_name: cifar10_sava_0.7_weakAug_exp0.01
cifar_root: ./data
gpu: 0
seed: 42