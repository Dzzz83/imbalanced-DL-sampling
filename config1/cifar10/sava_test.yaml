# Dataset Settings
dataset: cifar10
num_classes: 10
imb_type: exp        # Exponential imbalance
imb_factor: 1.0     # 100:1 ratio between head and tail classes
data_path: ./data
classifier: 'dot_product_classifier'

# Selection Settings
# --- LAVA (default) ---
selection_method: sava        # Options: lava, random, none, sava
selection_ratio: 0.7           # Keep 70% of the data based on scores
device: cuda
augmentation: weak

# --- SAVA (uncomment and set selection_method: sava to use) ---
sava_batch_size: 1024
sava_parallel: false
sava_cuda_num: 0
sava_n_gpu: 1
sava_feat_repr: false
sava_cache_label_distances: true
sava_model_path: ./models/cifar10_embedder_preact_resnet18.pth
resize: 32

# Training Strategy
strategy: MAMix_DRW
loss_type: CE        # Cross Entropy (can be LDAM or CB)
train_rule: None     # Can be 'DRW' to trigger re-weighting mid-training

# Hyperparameters
epochs: 200
start_epoch: 0
print_freq: 10

batch_size: 128
learning_rate: 0.1
momentum: 0.9
weight_decay: 2e-4
lr_steps: [120, 160] # Epochs where the learning rate drops
gamma: 0.1

rand_number: 0
# Augmentation
mamix_ratio: 0.25

workers: 4
optimizer: sgd
# Logging & Checkpoints
root_log: experiments/cifar10_exp0.01_MaMix_drw/lava
root_model: ./example/checkpoint_cifar10
store_name: cifar10_lava_selection_0.7_mixup_exp0.01
cifar_root: ./data
gpu: 0

seed: 42